services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      PERSISTENCE: postgres
      DATABASE_URL: postgresql+asyncpg://game:game@db:5432/game_engine
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    build:
      context: ./docker/postgres
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb"]
    environment:
      POSTGRES_USER: game
      POSTGRES_PASSWORD: game
      POSTGRES_DB: game_engine
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game -d game_engine"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
